<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <p>Conditional Statements</p>
    </div>
    <script>
        let x = prompt("Enter a random number")
        if (x % 2 == 0) {
            console.log("Even")
        } else {
            console.log("Odd")
        }

        let num1 = Number(prompt("Enter num1"))
        let num2 = Number(prompt("Enter num2"))
        let num3 = Number(prompt("Enter num3"))

        if (num1 > num2 && num1 > num3) {
            console.log(`${num1} is the largest`)
        } else if (num2 > num1 && num2 > num3) {
            console.log(`${num2} is the largest`)
        } else {
            console.log(`${num3} is the largest`)
        }

        //ternary operator
        let number = Number(prompt("Enter a random number"))

        let is_even = number % 2 == 0 ? "Even" : "Odd"
        console.log(is_even)

        //use a ternary operator to write a program that checks whether a person is eligible to drive, assume legal age of 18

        let age= Number(prompt("Enter a random age"))
        let eligible = age>= 18? "Elgible" : "Not Elgigible"
        console.log(elgible)

    </script>
</body>

</html>
